<!-- ROSTER R-HL (Recensement Hardcore) -->
  <section id="view-roster" class="view">
    <div class="page-head">
      <h2>Recensement Roster R-HL</h2>
      <p>Objectif Top 5 Serveur. Ou du moins essayer de ne pas mourir bêtement au premier pull.</p>
    </div>

    <form action="https://formspree.io/f/ton-code-formspree" method="POST" class="roster-form" style="max-width: 600px; margin: 0 auto; background: var(--panel); padding: 30px; border-radius: 8px; border: 1px solid var(--line);">
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="username" style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text);">Pseudo en jeu :</label>
            <input type="text" id="username" name="username" required placeholder="Ex: Aegoric" style="width: 100%; padding: 12px; background: var(--void); border: 1px solid var(--line); border-radius: 4px; color: var(--text); box-sizing: border-box;">
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label for="role" style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text);">Rôle Principal :</label>
            <select id="role" name="role" required style="width: 100%; padding: 12px; background: var(--void); border: 1px solid var(--line); border-radius: 4px; color: var(--text); box-sizing: border-box;">
                <option value="" disabled selected>-- Choisir ton rôle --</option>
                <option value="Tank">Tank (Celui qui prend les tatanes)</option>
                <option value="Heal">Heal (Celui qui regarde les barres de vie descendre)</option>
                <option value="DPS">DPS (Celui qui aggro avant le tank)</option>
            </select>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label for="class_spec" style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text);">Classe et Spé :</label>
            <input type="text" id="class_spec" name="class_spec" required placeholder="Ex: Mage Feu, Guerrier BDSM..." style="width: 100%; padding: 12px; background: var(--void); border: 1px solid var(--line); border-radius: 4px; color: var(--text); box-sizing: border-box;">
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label for="remarque" style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text);">Un mot à ajouter (ou une excuse sur ton niveau) :</label>
            <input type="text" id="remarque" name="remarque" placeholder="Ex: Je sais courir en arrière promis" style="width: 100%; padding: 12px; background: var(--void); border: 1px solid var(--line); border-radius: 4px; color: var(--text); box-sizing: border-box;">
        </div>

        <button type="submit" class="vote-btn" style="width: 100%; padding: 14px; font-size: 1.1rem; cursor: pointer;">Envoyer ma bêtise</button>
    </form>
  </section>
